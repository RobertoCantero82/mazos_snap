name: Actualizar y publicar radar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10,19 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar código
        run: python -m py_compile main.py dashboard.py database.py deck_utils.py models.py source_snapcomplete.py

      - name: Buscar mazos y generar panel
        run: python main.py --update

      - name: Preparar página
        run: |
          mkdir -p site
          cp panel_mazos.html site/index.html
          touch site/.nojekyll

      - name: Conservar nuevos mazos detectados
        shell: bash
        run: |
          nuevos=$(python -c "from database import stats; print((stats().get('ultima_ejecucion') or {}).get('inserted_count', 0))")
          if [ "$nuevos" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/mazos_snap.db
            git commit -m "Actualizar mazos detectados [skip ci]"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar página
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
